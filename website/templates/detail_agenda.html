<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <title>{{ agenda.nama_agenda }} | Agenda Ganesa</title>
</head>
<body class="bg-gray-50 font-sans">
    <div class="container mx-auto px-4 py-16">
        <div class="max-w-5xl mx-auto bg-white rounded-3xl shadow-2xl overflow-hidden">
            <div class="relative h-72 md:h-[420px] bg-[#1D3557]">
                {% if agenda.gambar %}
                    <img src="{{ agenda.gambar.url }}" class="w-full h-full object-cover" alt="Poster {{ agenda.nama_agenda }}">
                {% else %}
                    <div class="w-full h-full flex items-center justify-center text-white opacity-30">
                        <i class="fa-solid fa-calendar-days text-9xl"></i>
                    </div>
                {% endif %}
                <div class="absolute inset-0 bg-gradient-to-t from-[#1D3557]/90 via-transparent to-transparent"></div>
            </div>

            <div class="p-10 lg:p-16">
                <a href="javascript:history.back()" class="text-gray-400 hover:text-[#B5893E] font-bold mb-8 inline-block transition">
                    <i class="fa-solid fa-arrow-left mr-2"></i> KEMBALI
                </a>

                <p class="inline-block bg-amber-50 text-[#B5893E] px-4 py-2 rounded-full text-sm font-bold mb-6">
                    <i class="fa-solid fa-calendar-days mr-2"></i>{{ agenda.tanggal|date:"d F Y" }}
                </p>
                <h1 class="text-4xl md:text-5xl font-black text-[#1D3557] mb-8 leading-tight">
                    {{ agenda.nama_agenda }}
                </h1>

                <div class="border-t border-gray-100 pt-8">
                    <h3 class="font-bold text-[#1D3557] mb-4 uppercase text-sm tracking-[0.2em]">Deskripsi Agenda</h3>
                    <div class="text-gray-600 leading-relaxed text-lg text-justify">
                        {{ agenda.deskripsi|linebreaks }}
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
